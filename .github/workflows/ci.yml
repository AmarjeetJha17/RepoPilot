name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Workspace security tests (Linux)
        run: uv run --no-sync pytest tests/security/test_workspace_security.py -q

      - name: Workspace integration tests (Linux)
        run: uv run --no-sync pytest tests/integration/test_workspace_manager.py -q

      - name: Repository intelligence security tests (Linux)
        run: uv run --no-sync pytest tests/security/test_repository_intelligence.py -q

      - name: Repository intelligence integration tests (Linux)
        run: uv run --no-sync pytest tests/integration/test_repository_intelligence.py -q

      - name: Read-only dispatcher security tests (Linux)
        run: uv run --no-sync pytest tests/security/test_readonly_dispatcher.py -q

      - name: Read-only dispatcher integration tests (Linux)
        run: uv run --no-sync pytest tests/integration/test_readonly_dispatcher.py -q

      - name: Multi-step orchestration security tests (Linux)
        run: uv run --no-sync pytest tests/security/test_multistep_agent.py -q

      - name: Multi-step orchestration integration tests (Linux)
        run: uv run --no-sync pytest tests/integration/test_multistep_agent.py -q

      - name: Patch staging security tests (Linux)
        run: uv run --no-sync pytest tests/security/test_patch_staging.py -q

      - name: Patch staging integration tests (Linux)
        run: uv run --no-sync pytest tests/integration/test_patch_staging.py -q

      - name: Patch approval security tests (Linux)
        run: uv run --no-sync pytest tests/security/test_patch_approval.py -q

      - name: Patch approval integration tests (Linux)
        run: uv run --no-sync pytest tests/integration/test_patch_approval.py -q

      - name: Docker sandbox runner security tests (Linux)
        run: uv run --no-sync pytest tests/security/test_docker_sandbox.py -q

      - name: Docker sandbox runner integration tests (Linux)
        run: uv run --no-sync pytest tests/integration/test_docker_sandbox.py -q

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync mypy src/repopilot

      - name: Test
        run: uv run --no-sync pytest -q

      - name: Measure coverage
        run: >-
          uv run --no-sync pytest --cov=repopilot --cov-report=term-missing
          --cov-report=xml

      - name: Validate pre-commit configuration
        run: uv run --no-sync pre-commit validate-config

      - name: Build distributions
        run: uv build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
